<section class="skills" id="skills">

  <div class="skills-background">
    <div class="skills-glow skills-glow-one"></div>
    <div class="skills-glow skills-glow-two"></div>
  </div>

  <div class="skills-container">

    <p class="section-overline">COMPÉTENCES</p>

    <h2 class="section-title">
      Technologies & outils
    </h2>

    <p class="section-description">
      Les langages et frameworks que j'utilise au quotidien
      pour construire des expériences web modernes.
    </p>

    <div class="skills-grid">
      @for (skill of skills; track skill.name) {
        <div class="skill-card">
          <div class="skill-icon-wrapper">
            <i [class]="skill.icon"></i>
          </div>
          <span class="skill-name">{{ skill.name }}</span>
        </div>
      }
    </div>

  </div>

</section>
