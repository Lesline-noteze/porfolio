<footer class="footer">

  <div class="footer-container">

    <div class="footer-top">

      <div class="footer-brand">
        <a href="#accueil" class="footer-logo">
          <span class="logo-mark">N</span>
          <span class="logo-name">Lesline Notézé<span>.</span></span>
        </a>
        <p class="footer-tagline">
          Développeuse web, je transforme des idées en expériences digitales.
        </p>
      </div>

      <nav class="footer-nav">
        @for (link of navLinks; track link.href) {
          <a [href]="link.href">{{ link.label }}</a>
        }
      </nav>

      <div class="footer-social">
        <span class="social-label">Me retrouver</span>
        <div class="social-links">
          @for (social of socialLinks; track social.href) {
            
             <a  [href]="social.href"
              target="_blank"
              [attr.aria-label]="social.label"
              class="social-link"
            >
              {{ social.short }}
            </a>
          }
        </div>
      </div>

    </div>

    <div class="footer-bottom">
      <p>© {{ currentYear }} Lesline. Tous droits réservés.</p>
